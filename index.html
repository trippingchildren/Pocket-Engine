const T={runner:`// Tap to jump. Dodge the yellow blocks!
const g = game;
g.add({x:0, y:g.h-90, w:g.w, h:90, color:'#2f2a5c', solid:true});
const p = g.add({x:70, y:g.h-150, w:36, h:36, color:'#ff6b8b', gravity:1800});

  t += dt; g.score += dt;
  if (t > 1.2) {
    t = 0;
    g.add({x:g.w, y:g.h-120, w:30, h:30, color:'#fbbf24',
           vx:-300 - g.score * 8, tag:'hazard'});
  }
  g.each('hazard', h => {
    if (h.x < -50) g.remove(h);

  }

});`,catch:`// Drag to move the basket (touch, mouse or arrow keys). Tilt works on supported phones.
